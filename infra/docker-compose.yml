version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: bi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bi_admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bi_local_dev_pw}
      POSTGRES_DB: bi_platform
    ports:
      - "5432:5432"
    volumes:
      - bi_postgres_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bi_admin -d bi_platform"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: bi_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - bi_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bi_postgres_data:
  bi_redis_data:
